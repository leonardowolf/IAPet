; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-gray]
platform = espressif32
board = m5stack-core-esp32-16M ; M5Stack Gray: ESP32-D0WDQ6, 16MB flash, no PSRAM
board_build.partitions = default_16MB.csv ; use the full 16MB flash (board default is the 4MB table)
framework = arduino
build_flags = 
	; -D DEBUG ; uncomment to print heap usage
monitor_filters = colorize, time, esp32_exception_decoder
monitor_speed = 115200
lib_deps = 
	bblanchon/ArduinoJson
	links2004/WebSockets
	m5stack/M5Unified@^0.2.11